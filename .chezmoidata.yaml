# Remote Linux hosts to set up SSH reverse-forwarding to, from Mac clients:
# ssh_remote_xdg_open (browser URL opening) and op-forward (1Password CLI
# biometric forwarding). Each entry's aliases become one `Host` block in
# ~/.ssh/config; all aliases for one entry must resolve to the same physical
# machine, since they share one ControlPath (keyed on the first alias) and
# one host_alias value (each remote's own hostname, rendered independently
# on that machine).
#
# opForwardPort is the Mac-side port of that host's own op-forward daemon
# (see run_onchange_after_setup-op-forward-macos.sh.tmpl). Keep it unique and
# stable: changing it restarts the daemon and redeploys the host's token.
sshForwardedHosts:
  - aliases:
      - junction
      - junction.home.coderinserepeat.com
      - junction.gaur-kardashev.ts.net
    opForwardPort: 18341
  - aliases:
      - hagal
      - hagal.gaur-kardashev.ts.net
      - hagal.home.coderinserepeat.com
    opForwardPort: 18342
